    <!--
      Fonts — self-hosted, see the @font-face block in src/index.css.

      This used to be a render-blocking <link> to fonts.googleapis.com plus two
      preconnects. That put two extra DNS+TLS round trips on the critical path
      (googleapis for the CSS, then gstatic for the woff2s) before any text
      could paint. The files are now variable woff2s in public/fonts/, ~80KB
      total for all three families.

      These preloads matter: the @font-face rules live inside the bundled CSS,
      so without them the browser cannot discover the font URLs until that
      stylesheet has downloaded and parsed. `crossorigin` is REQUIRED on font
      preloads even for same-origin files — omit it and the browser fetches
      each font twice.
    -->
    <link rel="preload" href="/fonts/outfit-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/spacegrotesk-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/geistmono-var.woff2" as="font" type="font/woff2" crossorigin>
